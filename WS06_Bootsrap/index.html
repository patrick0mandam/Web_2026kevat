<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap JavaScript (place before closing </body> tag) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <link rel="icon" type="image/x-icon" href="./images/IMG_4560.ico">
  </head>
  <body>
    <header>
      <h1>Hello, world!</h1>
      <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
          <a class="navbar-brand" href="#">ASTRA</a>
          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
          <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="#">Home</a>
              </li>
              <li class="nav-item"><a class="nav-link" href="#">About</a></li>
              <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <main>
      <div class="container">
        <div class="row">
          <div class="col-md-4 col-12">Column 1</div>
          <div class="col-md-4 col-12">Column 2</div>
          <div class="col-md-4 col-12">Column 3</div>
        </div>
      </div>
      <hr>
      <button class="btn btn-primary">Primary</button>
      <button class="btn btn-secondary">Secondary</button>
      <button class="btn btn-success">Success</button>
      <hr>
      <div class="card" style="width: 18rem">
        <img src="./images/astra-MAINN.webp" class="card-img-top" alt="Card Image">
        <div class="card-body">
          <h2 class="card-title">"Money Dey Fala"</h2>
          <p class="card-text">
            This card showcases the beauty of Bootstrap.
          </p>
          <a href="#" class="btn btn-primary">Learn More</a>
        </div>
      </div>
      <hr>
      <div class="alert alert-info" role="alert">
        This is an info alert—check it out!
      </div>
    </main>
    <footer>
      <p>&copy; copyright reserved</p>
    </footer>
  </body>
</html>
